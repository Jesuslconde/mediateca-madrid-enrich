[project]
name = "mediateca-madrid-enrich"
version = "0.1.0"
description = "Ingesta, enriquecimiento e indexacion del catalogo de Mediateca Madrid"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "mediateca-shared==0.1.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "meilisearch>=0.31",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "jinja2>=3.1",
  "typer>=0.15",
  "rich>=13.9",
  "tenacity>=9.0",
  "apscheduler>=3.10",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
mediateca = "mediateca.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediateca"]

[tool.hatch.build.targets.sdist]
include = ["src/mediateca", "fixtures", "tests", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
